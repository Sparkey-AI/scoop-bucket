# Validates bucket/sparkey.json on every PR: manifest shape, and integrity
# against the release mirror (version and windows-x64 SHA256 must match the
# mirror's latest.json, and the download URL must stay on install.sparkey.ai).
name: Validate manifest
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate manifest shape and mirror integrity
        run: |
          set -euo pipefail
          M=bucket/sparkey.json
          jq -e . "$M" >/dev/null

          VERSION=$(jq -r '.version' "$M")
          HASH=$(jq -r '.architecture["64bit"].hash' "$M")
          URL=$(jq -r '.architecture["64bit"].url' "$M")

          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$' || { echo "bad version: $VERSION"; exit 1; }
          echo "$HASH" | grep -Eq '^[0-9a-f]{64}$' || { echo "bad sha256: $HASH"; exit 1; }
          case "$URL" in
            "https://install.sparkey.ai/v$VERSION/sparkey-windows-x64.exe#/sparkey.exe") ;;
            *) echo "download url does not match the release mirror pattern: $URL"; exit 1 ;;
          esac
          jq -e '.bin == "sparkey.exe"' "$M" >/dev/null || { echo "bad bin"; exit 1; }

          curl -fsSL https://install.sparkey.ai/latest.json -o /tmp/latest.json
          MIRROR_VERSION=$(jq -r '.latest_version' /tmp/latest.json)
          MIRROR_SHA=$(jq -r '.assets["sparkey-windows-x64.exe"].sha256 // empty' /tmp/latest.json)
          [ "$VERSION" = "$MIRROR_VERSION" ] || { echo "version $VERSION != mirror $MIRROR_VERSION"; exit 1; }
          [ "$HASH" = "$MIRROR_SHA" ] || { echo "sha256 mismatch: manifest=$HASH mirror=${MIRROR_SHA:-<missing>}"; exit 1; }
          echo "manifest OK: sparkey v$VERSION"
