# Sync bucket/sparkey.json from the public release mirror.
#
# The Sparkey source repo is private and org policy disables deploy keys, so
# the release pipeline cannot push here. Instead this bucket pulls: the mirror's
# latest.json (written by the release pipeline) is the source of truth for the
# current version and the windows-x64 SHA256.
#
# main is protected (PRs mandatory), so the sync opens a pull request instead
# of pushing directly. BUCKET_SYNC_TOKEN is a fine-grained PAT scoped to this
# repository only (contents + pull-requests write); using a PAT rather than
# GITHUB_TOKEN also lets the validation workflow run on the sync PRs.
name: Sync manifest
on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # Public repo: the default token reads fine. The PAT is applied only at
      # push/PR time (below) after whitespace is stripped — feeding it to
      # checkout raw breaks git auth when the pasted secret has a newline.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Open a PR if a new version is on the mirror
        env:
          GH_TOKEN: ${{ secrets.BUCKET_SYNC_TOKEN }}
        run: |
          set -euo pipefail
          GH_TOKEN="$(printf '%s' "${GH_TOKEN:-}" | tr -d '[:space:]')"
          export GH_TOKEN
          # The trimmed value may differ from the stored secret, so re-register
          # it for log masking before it can appear in any git/gh error output.
          [ -n "$GH_TOKEN" ] && echo "::add-mask::$GH_TOKEN"
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::BUCKET_SYNC_TOKEN is not set. Mint a fine-grained PAT scoped to this repo (Contents + Pull requests: read/write) and add it as a repository secret named BUCKET_SYNC_TOKEN."
            exit 1
          fi
          curl -fsSL https://install.sparkey.ai/latest.json -o /tmp/latest.json
          VERSION=$(jq -r '.latest_version' /tmp/latest.json)
          SHA=$(jq -r '.assets["sparkey-windows-x64.exe"].sha256 // empty' /tmp/latest.json)
          if [ -z "$VERSION" ] || [ -z "$SHA" ]; then
            echo "mirror latest.json missing version or windows sha — skipping"; exit 0
          fi
          CURRENT=$(jq -r '.version // empty' bucket/sparkey.json 2>/dev/null || true)
          if [ "$VERSION" = "$CURRENT" ]; then
            echo "bucket already at $VERSION"; exit 0
          fi
          BRANCH="manifest/v$VERSION"
          PUSH_URL="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code "$PUSH_URL" "refs/heads/$BRANCH" >/dev/null 2>&1; then
            echo "sync branch $BRANCH already exists — PR pending"; exit 0
          fi
          jq -n --arg version "$VERSION" --arg sha "$SHA" '{
            version: $version,
            description: "Capture coding-agent sessions from Claude Code, Cursor, Codex, and more.",
            homepage: "https://sparkey.ai",
            license: "Proprietary",
            architecture: {
              "64bit": {
                url: ("https://install.sparkey.ai/v" + $version + "/sparkey-windows-x64.exe#/sparkey.exe"),
                hash: $sha
              }
            },
            bin: "sparkey.exe",
            checkver: {
              url: "https://install.sparkey.ai/latest.json",
              jsonpath: "$.latest_version"
            },
            autoupdate: {
              architecture: {
                "64bit": {
                  url: "https://install.sparkey.ai/v$version/sparkey-windows-x64.exe#/sparkey.exe"
                }
              }
            }
          }' > bucket/sparkey.json
          git config user.name "sparkey-release"
          git config user.email "release@sparkey.ai"
          git checkout -b "$BRANCH"
          git add bucket/sparkey.json
          git commit -m "sparkey v$VERSION"
          git push "$PUSH_URL" "$BRANCH"
          gh pr create --repo "$GITHUB_REPOSITORY" \
            --title "sparkey v$VERSION" \
            --body "Automated manifest sync from the release mirror (install.sparkey.ai). Version and SHA256 are taken from the mirror's latest.json; the validate workflow cross-checks both." \
            --base main --head "$BRANCH"
